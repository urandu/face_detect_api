services:

  database:
      image: postgres:15-alpine
      volumes:
          - ./db_data/pgdata:/var/lib/postgresql/data/
      environment:
          POSTGRES_USER: django
          POSTGRES_DB: django
          POSTGRES_HOST_AUTH_METHOD: "trust"
      ports:
        - "5432"

  api:
      build: .
      command: ./bin/web_entrypoint.sh
      volumes:
          - ./:/django
      ports:
          - "8900:8000"
      env_file: &envfile
        - env.env
      depends_on:
        - broker
        - redis
        - database

  broker:
      image: rabbitmq:3.12-management-alpine
      env_file: *envfile
      ports:
        - "5672:5672"
        - "15672:15672"
        - "5671:5671"

  redis:
      image: 'redis:7-alpine'
      environment:
        - ALLOW_EMPTY_PASSWORD=yes
      ports:
        - "6379:6379"

  worker:
      build: .
      command: ./bin/worker_entrypoint.sh
      volumes:
          - ./:/django
      env_file: *envfile
      depends_on:
        - broker
        - redis
        - database

  minio:
        image: "minio/minio:latest"
        command: server /data --console-address ":9001"
        env_file: *envfile
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - ./storage/minio:/data
